name: Bump Service Worker Cache Version

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'sw.js'

jobs:
  bump-cache-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp CACHE_NAME with short commit SHA
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/const CACHE_NAME = '.*';/const CACHE_NAME = 'sentrax-${SHORT_SHA}';/" sw.js
          cat sw.js | head -n 1

      - name: Commit updated sw.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- sw.js; then
            echo "No cache version change needed, skipping commit."
          else
            git add sw.js
            git commit -m "chore: bump service worker cache version [skip ci]"
            git pull --rebase origin main
            git push
          fi
