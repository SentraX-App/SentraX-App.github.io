name: Sentra-X Alert Checker

# Retired 2026-08-15 — superseded by the sentrax-alert-checker Cloudflare
# Worker, to stop duplicate caregiver alerts and duplicate Termii SMS costs.
# Schedule trigger removed below; workflow_dispatch is kept so this can
# still be run manually as an emergency fallback if the Worker ever needs
# to be rolled back.
on:
  workflow_dispatch:

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - run: node check-alerts.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
