<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>SOS alert test</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:18px;max-width:560px;margin:0 auto;}
  h1{font-size:20px;margin:6px 0 4px;} p{color:#94a3b8;font-size:14px;line-height:1.5;}
  label{display:block;font-size:13px;color:#94a3b8;margin:14px 0 4px;}
  input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:16px;}
  button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;font-size:16px;font-weight:600;background:#2563eb;color:#fff;}
  button.alt{background:#334155;}
  pre{background:#020617;border:1px solid #334155;border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;font-size:13px;min-height:90px;}
  .warn{background:#422006;color:#fde68a;border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0;}
</style>
</head>
<body>
<h1>SOS alert test</h1>
<p>Sends one test message through your live alert service and shows exactly what it answers. Use your own phone and email only.</p>
<div class="warn">Delete this file from the repo when you are done. It is not linked from anywhere, but it should not stay online.</div>
<label for="p">Your phone number (SMS)</label>
<input id="p" type="tel" placeholder="08012345678" autocomplete="off">
<label for="e">Your email address (email)</label>
<input id="e" type="email" placeholder="you@example.com" autocomplete="off">
<button id="b1">Test SMS only</button>
<button id="b2" class="alt">Test email only</button>
<button id="b3" class="alt">Test both</button>
<label>Result (copy or screenshot this and send it to me)</label>
<pre id="out">Waiting...</pre>
<script>
(function(){
  var out=document.getElementById('out');
  function norm(n){n=String(n||'').replace(/[^0-9]/g,'');if(!n)return '';if(n.indexOf('234')===0)return n;if(n.charAt(0)==='0')return '234'+n.slice(1);return '234'+n;}
  async function cfg(){
    var t=await (await fetch('/script.js?cb='+Date.now(),{cache:'no-store'})).text();
    var u=t.match(/const SOS_SMS_WORKER_URL = '([^']+)'/), s=t.match(/const SOS_WORKER_SHARED_SECRET = '([^']+)'/);
    if(!u||!s) throw new Error('Could not read the alert service settings from script.js');
    return {url:u[1],secret:s[1]};
  }
  async function run(useSms,useEmail){
    out.textContent='Sending...';
    try{
      var c=await cfg();
      var phone=useSms?norm(document.getElementById('p').value):'';
      var email=useEmail?document.getElementById('e').value.trim():'';
      if(!phone&&!email){out.textContent='Enter a phone number and/or email first.';return;}
      var started=Date.now();
      var res=await fetch(c.url,{method:'POST',headers:{'Content-Type':'application/json','X-Sentra-Secret':c.secret},
        body:JSON.stringify({phone:phone,email:email,name:'Test',message:'Sentra-X test message. Please ignore.'})});
      var txt=await res.text();
      out.textContent='Sent: '+(phone?('SMS to '+phone+' '):'')+(email?('Email to '+email):'')+'\n'+
        'HTTP status: '+res.status+' ('+(Date.now()-started)+' ms)\n\nAnswer from the service:\n'+txt;
    }catch(err){
      out.textContent='The request itself failed: '+(err&&err.message?err.message:err)+'\n\nThis usually means no internet, or the service is unreachable.';
    }
  }
  document.getElementById('b1').onclick=function(){run(true,false);};
  document.getElementById('b2').onclick=function(){run(false,true);};
  document.getElementById('b3').onclick=function(){run(true,true);};
})();
</script>
</body>
</html>
